name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to release or retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          cache: true
          install_args: go node npm:tagsmith goreleaser git-cliff
      # A retry can repair release tooling without moving the published tag.
      - name: Check out release source
        if: github.event_name == 'workflow_dispatch'
        run: git checkout --detach "refs/tags/$RELEASE_TAG"
      - name: Validate stable release tag
        run: |
          git fetch --force --tags origin
          mise exec -- tagsmith validate --tag "$RELEASE_TAG" --channel stable --github-output
      - name: Cache Go modules and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod') }}-
      - name: Test
        run: mise run test
      - name: Generate release notes
        run: mise exec -- git-cliff --current > "$RUNNER_TEMP/release-notes.txt"
      - name: Publish release
        run: mise exec -- goreleaser release --clean --release-notes "$RUNNER_TEMP/release-notes.txt"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: homebrew-aiusage
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Keep retry tooling on the workflow ref, not the historical release tag.
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: sadiksaifi/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          path: homebrew-tap
      - name: Generate Homebrew formula
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$RELEASE_TAG.tar.gz" \
            -o "$RUNNER_TEMP/source.tar.gz"
          sh .github/scripts/update-homebrew.sh "$RELEASE_TAG" "$RUNNER_TEMP/source.tar.gz" homebrew-tap
      - name: Publish Homebrew formula
        working-directory: homebrew-tap
        run: |
          if [ ! -f Formula/aiusage.rb ]; then exit 0; fi
          git add Formula/aiusage.rb
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update aiusage to $RELEASE_TAG"
          # A concurrent tap write must fail rather than rebase a stale formula over it.
          git push origin HEAD:main
